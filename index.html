
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Edidiong Mfon - High-performance frontend engineering portfolio." />
    <title>Edidiong Mfon | Frontend Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            backgroundImage: {
              'grid-white': "url(\"data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' fill='none' stroke='rgba(255, 255, 255, 0.05)'%3e%3cpath d='M0 .5H31.5V32'/%3e%3c/svg%3e\")",
              'grid-black': "url(\"data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' fill='none' stroke='rgba(0, 0, 0, 0.05)'%3e%3cpath d='M0 .5H31.5V32'/%3e%3c/svg%3e\")",
              'noise': "url('https://grainy-gradients.vercel.app/noise.svg')",
              'halftone': "radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px)",
            },
            colors: {
              glass: {
                100: 'rgba(255, 255, 255, 0.03)',
                200: 'rgba(255, 255, 255, 0.05)',
                300: 'rgba(255, 255, 255, 0.1)',
                border: 'rgba(255, 255, 255, 0.1)',
                highlight: 'rgba(255, 255, 255, 0.2)',
              },
              silver: {
                 100: '#f5f5f5',
                 200: '#e5e5e5',
                 300: '#d4d4d4',
                 400: '#c0c0c0', // Bright Silver
                 500: '#a3a3a3', // Matte Silver/Ash
                 600: '#737373', // Darker Ash
                 800: '#404040',
                 900: '#262626',
              }
            },
            transitionTimingFunction: {
              'editorial': 'cubic-bezier(0.25, 1, 0.5, 1)',
              'bounce-subtle': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
            },
            animation: {
              'blob': 'blob 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1)',
              'float': 'float 8s ease-in-out infinite',
              'shimmer': 'shimmer 3s linear infinite',
              'reveal': 'reveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards',
              'marquee': 'marquee 40s linear infinite',
              'marquee-reverse': 'marqueeReverse 40s linear infinite',
              'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glass-pulse': 'glassPulse 4s ease-in-out infinite',
              'glow-pulse': 'glowPulse 2s ease-in-out infinite',
              'scanline': 'scanline 2s linear infinite',
              'pan-slow': 'pan 40s linear infinite alternate',
              'pan-vertical': 'panVertical 60s linear infinite alternate',
              'grain': 'grain 0.5s steps(1) infinite',
              'drift': 'drift 20s linear infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              reveal: {
                '0%': { opacity: '0', transform: 'translateY(40px) scale(0.98)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              marqueeReverse: {
                '0%': { transform: 'translateX(-50%)' },
                '100%': { transform: 'translateX(0)' },
              },
              glassPulse: {
                 '0%, 100%': { 
                   borderColor: 'rgba(255, 255, 255, 0.1)',
                   boxShadow: '0 0 0 rgba(0, 0, 0, 0)' 
                 },
                 '50%': { 
                   borderColor: 'rgba(229, 229, 229, 0.3)', // silver-200 ish
                   boxShadow: '0 0 20px rgba(229, 229, 229, 0.1)' 
                 },
              },
              glowPulse: {
                '0%, 100%': { boxShadow: '0 0 0 0px rgba(229, 229, 229, 0)' },
                '50%': { boxShadow: '0 0 25px 5px rgba(229, 229, 229, 0.2)' },
              },
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              },
              pan: {
                '0%': { objectPosition: '0% 50%' },
                '100%': { objectPosition: '100% 50%' },
              },
              panVertical: {
                '0%': { objectPosition: '50% 0%' },
                '100%': { objectPosition: '50% 100%' },
              },
              grain: {
                '0%, 100%': { transform: 'translate(0, 0)' },
                '10%': { transform: 'translate(-5%, -10%)' },
                '20%': { transform: 'translate(-15%, 5%)' },
                '30%': { transform: 'translate(7%, -25%)' },
                '40%': { transform: 'translate(-5%, 25%)' },
                '50%': { transform: 'translate(-15%, 10%)' },
                '60%': { transform: 'translate(15%, 0%)' },
                '70%': { transform: 'translate(0%, 15%)' },
                '80%': { transform: 'translate(3%, 35%)' },
                '90%': { transform: 'translate(-10%, 10%)' },
              },
              drift: {
                '0%': { transform: 'translateY(0px) translateX(0px) rotate(0deg)' },
                '100%': { transform: 'translateY(-100px) translateX(20px) rotate(10deg)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      
      body {
        background-color: #050505; /* Dark background */
        color: #e5e5e5; /* Light text */
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #262626; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #404040; 
      }
      
      /* Hide scrollbar */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      *:focus-visible {
        outline: 2px solid #a3a3a3; /* Silver focus */
        outline-offset: 4px;
      }

      .mask-gradient {
        mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      }
      
      .mask-vertical-fade {
        mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
        -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
      }
      
      /* Paper texture overlay */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.15; /* Increased opacity */
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: overlay;
        filter: contrast(150%) brightness(100%); /* High contrast for magazine feel */
      }

      /* 3D Perspective Utilities */
      .perspective-1000 {
        perspective: 1000px;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }

      /* PRINT STYLES - Ensures resume looks like a document */
      @media print {
        body {
          background-color: white !important;
          color: black !important;
        }
        
        /* Hide everything by default */
        body > * {
          display: none !important;
        }

        /* Only show the CV section wrapper and its children */
        #root {
          display: block !important;
        }
        
        /* Hide all sections except CV */
        #root > div > section:not(#cv) {
            display: none !important;
        }
        #root > div > header,
        #root > div > footer,
        #root > div > div.fixed {
            display: none !important;
        }

        /* Ensure CV section is visible and styled for print */
        #cv {
            display: block !important;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            margin: 0;
            padding: 20px;
            background: white !important;
            color: black !important;
        }

        /* Reset transformations and colors for print */
        #cv * {
            transform: none !important;
            box-shadow: none !important;
            background: transparent !important;
            color: black !important;
            border-color: #ccc !important;
        }
        
        /* Specific adjustments for the card */
        #cv > div {
            border: none !important;
            padding: 0 !important;
        }
        
        /* Hide the download/print button in print mode */
        #cv a[role="button"], #cv button {
            display: none !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",

</html>
